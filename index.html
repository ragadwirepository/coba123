<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Rekapitulasi Penilaian Festival Inovasi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --primary-red: #9e1b1b;
      --dark-red: #7f1414;
      --border-color: #e5e7eb;
      --text-dark: #1f2937;
      --text-muted: #6b7280;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: var(--text-dark);
      padding: 20px;
    }

    .container {
      max-width: 1440px;
      margin: 0 auto;
    }

    .header-banner {
      background: linear-gradient(90deg, #991b1b 0%, #b91c1c 100%);
      color: #ffffff;
      border-radius: 12px;
      padding: 20px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      box-shadow: 0 4px 12px rgba(153, 27, 27, 0.2);
      margin-bottom: 20px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo-box {
      width: 48px;
      height: 54px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 4px;
    }

    .logo-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .header-title h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .header-title p {
      font-size: 13px;
      color: #fca5a5;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-pill {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      padding: 8px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #4ade80;
      border-radius: 50%;
    }

    .btn-refresh {
      background: #ffffff;
      color: var(--primary-red);
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-refresh:hover {
      background: #fee2e2;
    }

    .btn-refresh:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }

    .tab-group {
      display: flex;
      gap: 8px;
    }

    .tab-btn {
      padding: 10px 26px;
      border-radius: 6px;
      border: 1px solid #d1d5db;
      background: #ffffff;
      color: var(--text-dark);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: linear-gradient(180deg, #b91c1c 0%, #881313 100%);
      color: #ffffff;
      border-color: #881313;
      box-shadow: 0 2px 6px rgba(153, 27, 27, 0.25);
    }

    .right-controls {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn-input {
      background: linear-gradient(180deg, #991b1b 0%, #7f1414 100%);
      color: #ffffff;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(127, 20, 20, 0.25);
      transition: all 0.2s ease;
      border: 1px solid #7f1414;
    }

    .btn-input:hover {
      background: linear-gradient(180deg, #b91c1c 0%, #991b1b 100%);
      transform: translateY(-1px);
    }

    .stats-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .stat-card {
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 8px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .stat-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-dark);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 800;
      color: #111827;
    }

    .category-section {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .section-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: #111827;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-kategori {
      background: #f3f4f6;
      border: 1px solid #d1d5db;
      padding: 3px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 800;
      color: #111827;
    }

    .table-label-right {
      font-size: 13px;
      font-weight: 800;
      color: #1f2937;
      letter-spacing: 0.5px;
    }

    .table-wrapper {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid #f1f5f9;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1120px;
    }

    thead th {
      padding: 12px 12px;
      font-size: 12px;
      font-weight: 700;
      text-align: left;
    }

    th.th-left {
      background-color: #fdf2f2;
      color: #991b1b;
      border-bottom: 1px solid #fee2e2;
    }

    th.th-rank {
      width: 85px;
      text-align: center;
    }

    th.th-instansi {
      width: 220px;
    }

    th.th-score {
      background-color: var(--primary-red);
      color: #ffffff;
      text-align: center;
      min-width: 115px;
      max-width: 155px;
      white-space: normal;
      line-height: 1.25;
      border-right: 1px solid rgba(255, 255, 255, 0.14);
    }

    th.th-total {
      background-color: var(--dark-red);
      color: #ffffff;
      text-align: center;
      width: 85px;
    }

    tbody tr {
      border-bottom: 1px solid #f1f5f9;
      transition: background 0.15s;
    }

    tbody tr:nth-child(even) {
      background-color: #fafafa;
    }

    tbody tr:hover {
      background-color: #fef2f2;
    }

    tbody td {
      padding: 13px 12px;
      font-size: 13.5px;
      vertical-align: middle;
    }

    td.td-rank {
      text-align: center;
    }

    .rank-circle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      font-size: 12px;
      font-weight: 800;
      background-color: #f1f5f9;
      color: #475569;
    }

    .rank-1 { background-color: #fee2e2; color: #b91c1c; }
    .rank-2 { background-color: #dbeafe; color: #1d4ed8; }
    .rank-3 { background-color: #fef3c7; color: #b45309; }

    .inovasi-name {
      font-weight: 700;
      color: #111827;
      line-height: 1.4;
    }

    .tipe-pill {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
      background: #e2e8f0;
      color: #334155;
      vertical-align: middle;
    }

    .instansi-name {
      font-weight: 600;
      color: #374151;
      font-size: 12.5px;
      text-transform: uppercase;
    }

    td.td-score {
      text-align: center;
      font-weight: 600;
      color: #374151;
    }

    td.td-total {
      text-align: center;
      font-weight: 800;
      font-size: 14px;
      color: var(--primary-red);
      background-color: rgba(254, 226, 226, 0.25);
    }

    .loading-state {
      text-align: center;
      padding: 50px;
      color: var(--text-muted);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-banner">
      <div class="header-left">
        <div class="logo-box">
          <img src="https://upload.wikimedia.org/wikipedia/commons/f/fe/Lambang_Kota_Pekalongan.png?utm_source=id.wikipedia.org&utm_campaign=index&utm_content=original" alt="Logo">
        </div>
        <div class="header-title">
          <h1>Dashboard Rekapitulasi Penilaian Festival Inovasi</h1>
          <p id="lastUpdated">Pembaruan terakhir : Memuat data...</p>
        </div>
      </div>

      <div class="header-right">
        <div class="status-pill">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">Terhubung</span>
        </div>
        <button class="btn-refresh" id="btnRefresh" onclick="loadData()">
          ↻ Refresh Sekarang
        </button>
      </div>
    </div>

    <div class="controls-bar">
      <div class="tab-group">
        <button class="tab-btn active" onclick="setTab('IDE', this)">IDE</button>
        <button class="tab-btn" onclick="setTab('AKTIF', this)">AKTIF</button>
        <button class="tab-btn" onclick="setTab('SEMUA', this)">SEMUA</button>
      </div>

      <div class="right-controls">
        <!-- Ganti tanda # dengan URL halaman input Anda -->
        <a href="#" class="btn-input">Halaman input</a>

        <div class="stats-group">
          <div class="stat-card">
            <span class="stat-label">TOTAL INOVASI</span>
            <span class="stat-value" id="statInovasi">0</span>
          </div>
          <div class="stat-card">
            <span class="stat-label">TOTAL SUARA MASUK</span>
            <span class="stat-value" id="statSuara">0</span>
          </div>
        </div>
      </div>
    </div>

    <div id="contentArea">
      <div class="loading-state">Memuat data rekapitulasi penilaian...</div>
    </div>
  </div>

  <script>
    // GANTI URL DI BAWAH DENGAN URL WEB APP APPS SCRIPT ANDA (/exec)
    const API_URL = 'https://script.google.com/macros/s/AKfycbykT0pWKPwXWjKMOXNEjYA-67cVdlLjOjO-RcrSbChkyXqvA6W9PrAn-RTrsaH1riXm/exec';

    const DEFAULT_JURI_NAMES = ['JURI 1', 'JURI 2', 'JURI 3', 'JURI 4', 'JURI 5', 'JURI 6', 'JURI 7'];
    let rawData = { ide: [], aktif: [], juriNames: DEFAULT_JURI_NAMES };
    let currentTab = 'IDE';
    const URUTAN_KATEGORI = ['SEKOLAH', 'OPD', 'UNIT'];

    window.onload = function() {
      loadData();
      setInterval(loadData, 60000);
    };

    async function loadData() {
      const btn = document.getElementById('btnRefresh');
      const statusText = document.getElementById('statusText');
      btn.disabled = true;
      statusText.textContent = 'Memperbarui...';

      try {
        const response = await fetch(API_URL, { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const res = await response.json();

        if (res.success) {
          rawData.ide = res.ide || [];
          rawData.aktif = res.aktif || [];
          rawData.juriNames = (Array.isArray(res.juriNames) && res.juriNames.length === 7)
            ? res.juriNames
            : DEFAULT_JURI_NAMES;

          document.getElementById('lastUpdated').textContent = 'Pembaruan terakhir : ' + res.lastUpdated;
          statusText.textContent = 'Terhubung';
          document.getElementById('statusDot').style.backgroundColor = '#4ade80';
          renderDashboard();
        } else {
          throw new Error(res.error || 'Respons tidak valid');
        }
      } catch (err) {
        statusText.textContent = 'Gagal Memuat';
        document.getElementById('statusDot').style.backgroundColor = '#f87171';
        document.getElementById('contentArea').innerHTML =
          '<div class="loading-state">Gagal memuat data: ' + escapeHtml(err.message) + '</div>';
      } finally {
        btn.disabled = false;
      }
    }

    function setTab(tabName, btnElement) {
      currentTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
      renderDashboard();
    }

    function renderDashboard() {
      let activeList = [];
      if (currentTab === 'IDE') {
        activeList = [...rawData.ide];
      } else if (currentTab === 'AKTIF') {
        activeList = [...rawData.aktif];
      } else {
        activeList = [...rawData.ide, ...rawData.aktif];
      }

      document.getElementById('statInovasi').textContent = activeList.length;
      const totalSuara = activeList.reduce((acc, item) => acc + item.suaraMasuk, 0);
      document.getElementById('statSuara').textContent = totalSuara;

      const contentArea = document.getElementById('contentArea');
      if (activeList.length === 0) {
        contentArea.innerHTML = '<div class="loading-state">Belum ada data pada kategori ini.</div>';
        return;
      }

      const headersHtml = rawData.juriNames
        .map(nama => `<th class="th-score">${escapeHtml(nama)}</th>`)
        .join('');

      let html = '';

      URUTAN_KATEGORI.forEach(kategori => {
        const items = activeList
          .filter(item => item.kategori === kategori)
          .sort((a, b) => b.total - a.total);

        if (items.length === 0) return;

        html += `
          <div class="category-section">
            <div class="section-header-row">
              <div class="section-title">
                <span>${items.length} Inovasi dengan Suara Tertinggi —</span>
                <span class="badge-kategori">${kategori}</span>
              </div>
              <div class="table-label-right">TABEL NILAI</div>
            </div>

            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th class="th-left th-rank">Peringkat</th>
                    <th class="th-left">Nama Inovasi</th>
                    <th class="th-left th-instansi">OPD / Unit</th>
                    ${headersHtml}
                    <th class="th-total">TOTAL</th>
                  </tr>
                </thead>
                <tbody>
        `;

        items.forEach((item, idx) => {
          const rankNum = idx + 1;
          const rankClass = rankNum <= 3 ? `rank-${rankNum}` : '';
          const tipeBadge = currentTab === 'SEMUA'
            ? `<span class="tipe-pill">${item.tipe}</span>`
            : '';

          html += `
            <tr>
              <td class="td-rank">
                <span class="rank-circle ${rankClass}">${rankNum}</span>
              </td>
              <td>
                <div class="inovasi-name">${escapeHtml(item.namaInovasi)}${tipeBadge}</div>
              </td>
              <td>
                <div class="instansi-name">${escapeHtml(item.instansi)}</div>
              </td>
              <td class="td-score">${item.juri[0]}</td>
              <td class="td-score">${item.juri[1]}</td>
              <td class="td-score">${item.juri[2]}</td>
              <td class="td-score">${item.juri[3]}</td>
              <td class="td-score">${item.juri[4]}
